name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # CI o'z Postgres konteynerida ishlaydi — Supabase'ga tegmaydi.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/escrowuz_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/escrowuz_test
  JWT_SECRET: ci-only-secret-not-used-anywhere-else-0000000000
  JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-elsewhere-1111
  # Akkaunt ma'lumotlari va chat shu kalit bilan shifrlanadi. Usiz
  # `config/env.ts` ishga tushishda `process.exit(1)` qiladi va BARCHA
  # testlar boshlanmasdan yiqiladi.
  CREDENTIALS_SECRET: ci-only-credentials-key-not-used-elsewhere-2222
  NODE_ENV: test
  PAYMENT_PROVIDER: mock

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escrowuz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `npm audit --audit-level=high` o'rniga: bir xil qat'iylik, lekin
      # ataylab kechirilgan advisory'lar sabab va muddat bilan yozilgan.
      - name: Zaifliklar tekshiruvi
        run: node scripts/audit-gate.mjs

      - run: npm run db:generate

      - name: Migratsiyalarni qo'llash
        run: npm run db:deploy --workspace=@escrowuz/api

      - name: Tiplar tekshiruvi
        run: npm run typecheck

      # Web'ni ALOHIDA build qilamiz. `next build` o'zi tip tekshiruvini
      # bajaradi — ya'ni frontend xatosi Vercel'da emas, shu yerda chiqadi.
      # `npm run typecheck` web'ni qamramaydi, chunki Next o'z tiplarini
      # build paytida generatsiya qiladi.
      - name: Web build (Vercel'ni takrorlaydi)
        run: |
          npm run build --workspace=@escrowuz/shared
          npm run build --workspace=@escrowuz/web
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

      - name: Testlar
        run: npm test

      # ─────────────────────────────────────────────────────────────────────
      # §4 TALABI: butun ledgerning SUM(amount) = 0 bo'lishi shart.
      # Testlardan KEYIN ishlaydi — testlar bazaga haqiqiy pul harakatlarini
      # yozib qo'ygan bo'ladi, shuning uchun bu tekshiruv haqiqiy ma'noga ega.
      # 0 dan farq qilsa build yiqiladi.
      # ─────────────────────────────────────────────────────────────────────
      - name: Ledger muvozanati (SUM = 0)
        run: npm run ledger:check
